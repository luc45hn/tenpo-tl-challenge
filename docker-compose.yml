# Runs the whole application. Postgres and Redis are only reachable from the other services;
# publish their ports for local development with docker-compose.dev.yml.
# The credentials below are demo defaults, overridable through environment variables.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-challenge}
      POSTGRES_USER: ${POSTGRES_USER:-challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-challenge}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8.10.2-alpine
    # Append-only file, so the last cached percentage survives a restart
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    # `docker compose up` pulls the published image; `docker compose up --build` builds it locally
    image: lucashn81/tenpo-tl-challenge:latest
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-challenge}
      POSTGRES_USER: ${POSTGRES_USER:-challenge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-challenge}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RATELIMIT_MAXREQUESTS: ${RATELIMIT_MAX_REQUESTS:-3}
      RATELIMIT_WINDOW: ${RATELIMIT_WINDOW:-1m}
      PERCENTAGE_CACHE_TTL: ${PERCENTAGE_CACHE_TTL:-30m}
      PERCENTAGE_RETRY_MAXATTEMPTS: ${PERCENTAGE_RETRY_MAX_ATTEMPTS:-3}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5

volumes:
  postgres-data:
  redis-data:
