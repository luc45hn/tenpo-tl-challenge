spring:
  application:
    name: tenpo-tl-challenge
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:challenge}
    username: ${POSTGRES_USER:challenge}
    password: ${POSTGRES_PASSWORD:challenge}
    hikari:
      # Fail fast when Postgres is unreachable instead of waiting HikariCP's 30s default
      # (milliseconds)
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 1s
      timeout: 1s
  web:
    # Everything the API returns (e.g. validation messages) is in English, whatever the JVM
    # default locale or the client's Accept-Language header
    locale: en
    locale-resolver: fixed

management:
  endpoints:
    web:
      exposure:
        # Only the health endpoint, used by the container healthcheck
        include: health

percentage:
  client:
    base-url: http://localhost:8080
    connect-timeout: 1s
    read-timeout: 2s
  cache:
    ttl: 30m
  retry:
    max-attempts: 3
    delay: 200ms

history:
  max-body-length: 10000
  executor:
    core-pool-size: 1
    max-pool-size: 2
    queue-capacity: 500

ratelimit:
  max-requests: 3
  window: 1m

springdoc:
  default-produces-media-type: application/json
  # Every error response is declared explicitly (see OpenApiConfig), none inferred from the
  # exception handlers
  override-with-generic-response: false
